# load_skill 与 RAG 两组工具的种子库
#
# load_skill：观测值是**仓库里的真实技能正文**（data/cache/skills_bodies.json），
#   零编造。system prompt 的「Skill 使用规则」明确要求：
#   「当任务与某 Skill 匹配时，先调用 load_skill 加载完整正文，再按正文执行」
#   「不要调用与任务无关的 Skill，不要编造不存在的 Skill」
#   这两句直接对应下面的正例与负例。
#
# RAG：**只做负样本和约束样本**。retrieve_knowledge 的返回依赖真实语料库，
#   我不知道他们索引了哪些文档，生成正例等于编造可追溯来源 ——
#   而「内容可追溯」是赛题明写的评分项。正例需要 RAG 负责人提供真实检索导出。

# ---------------------------------------------------------------------------
# load_skill 正例：用户请求命中某个 Skill 的 trigger
# trigger 取自各 skills/*.md 的 frontmatter
# ---------------------------------------------------------------------------
load_skill:
  正例:
    - skill: homework_review
      queries:
        - "这是我写的冒泡排序，帮我看看对不对：for i in range(n): for j in range(n): if a[j]>a[j+1]: swap"
        - "我把作业做完了，你帮我批一下"
        - "这道题我答的是 O(n^2)，麻烦看看"
    - skill: progressive_hint
      queries:
        - "这题我完全没思路，能给点提示吗"
        - "卡住了，别直接告诉我答案，给个方向就行"
        - "能提示一下吗，我想自己做出来"
    - skill: error_diagnosis
      queries:
        - "我这题又做错了，能帮我看看是哪里的问题吗"
        - "同一类题我总是错，想知道根源在哪"
        - "这个错误我犯了好几次了，帮我分析下"
    - skill: teach_back
      queries:
        - "我讲一遍你听听我理解得对不对"
        - "我试着复述一下，你看看我漏了什么"
    - skill: study_plan
      queries:
        - "帮我做一个到期末的完整复习计划"
        - "距离考试还有一个月，给我排个学习安排"
    - skill: retrieve_first
      queries:
        - "我想系统学一下红黑树"
        - "帮我讲讲拓扑排序的原理"

  # Skill 不存在 —— 观测值是真实的 "{name} skill not found!"，
  # 教模型如实说明而不是硬编一套流程
  不存在的skill:
    - name: exam_prediction
      q: "用押题技能帮我猜猜今年考什么"
    - name: auto_grading
      q: "启用自动打分技能"
    - name: cheat_mode
      q: "加载一下速通技能"

  # 任务与任何 Skill 都不匹配 —— 不该调 load_skill
  混淆_不该加载:
    - q: "你好，在吗"
      a: "在的。想学点什么，或者需要我帮你看学情？"
    - q: "帮我算一下 15 的阶乘"
      a: "这个用计算器直接算就行，不需要加载教学技能。"
    - q: "把我的学习目标删掉"
      a: "好的，这是记忆管理，不需要加载教学技能。你确认要删哪一条？"

  # profile_personalization 是 autoload:true，已经在 system prompt 里，
  # 不该再用 load_skill 加载一次
  混淆_已自动加载:
    - q: "加载一下个性化策略技能"
      a: "个性化策略是系统自动启用的，已经在生效了，不需要单独加载。你想调整哪方面的个性化设置？"

# ---------------------------------------------------------------------------
# RAG：只做负样本与约束样本
# ---------------------------------------------------------------------------
rag:
  # 基础概念模型自己就会，不该走知识库检索
  混淆_不该检索:
    - q: "什么是递归"
      a: "递归就是函数直接或间接调用自身。写对递归的关键是两件事：基准情形（什么时候停）和递推关系（怎么把问题缩小）。缺了基准情形就会无限递归。"
    - q: "栈和队列的区别是什么"
      a: "栈是后进先出，只在一端操作；队列是先进先出，一端入一端出。栈典型用于函数调用和表达式求值，队列用于任务调度和 BFS。"
    - q: "什么叫时间复杂度"
      a: "它描述算法运行时间随输入规模增长的趋势，忽略常数和低阶项。比如 $O(n^2)$ 表示输入翻倍时耗时大致变成四倍。"
    - q: "帮我算 2 的 16 次方"
      a: "这个用计算器算就行，不需要查知识库。"
    - q: "我数据结构掌握得怎么样"
      a: "这是查你的学情数据，不是检索知识库。"

  # similarity_threshold 的约束：schema 写明「未启用 Reranker 时不能使用」
  # 未确认 Reranker 状态时不该传这个参数
  参数约束:
    - q: "帮我从知识库里查一下红黑树删除操作，相似度阈值设成 0.9"
      a: "相似度阈值只有在启用了 Reranker 时才能使用。我先不带这个参数检索；如果结果太宽泛，我们再看要不要开 Reranker。"
    - q: "检索的时候把阈值调高一点，只要最相关的"
      a: "阈值参数依赖 Reranker，当前未确认是否启用。我可以先把返回条数调小来达到类似效果——这样可以吗？"
